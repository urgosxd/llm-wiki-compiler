name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  # Linux only — a deliberate, revisitable choice, recorded here because it is
  # what let issue #163 ship: on win32 `path.sep` ("\") made every nested profile
  # directory fail containment, so no profile could load, and nothing here saw it.
  #
  # A windows-latest leg was tried in #172 and taken back out. It confirmed the
  # separator fix holds on win32, then surfaced 64 unrelated failures across 44
  # files — chiefly that O_NOFOLLOW is POSIX-only, so every "fails closed on a
  # symlinked leaf" guard quietly degrades to a plain open there. Nor is
  # `continue-on-error` a way to land the leg non-blocking: the workflow run goes
  # green but the job's check-run still reports failure and blocks the merge.
  #
  # So win32 behaviour is held by the `sep` test seam in `src/utils/path-confine.ts`,
  # NOT by CI. Restoring this leg means fixing those 64 failures first — worth
  # doing as its own change, and not free.
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    # The wiki stores its corpus, graph, candidates and compile state in Postgres,
    # so a Stack-less project is on its way out. The database-backed suites no
    # longer skip when the harness is unreachable: they fail loudly instead. This
    # service exists so those suites can actually run here, and the job now fails
    # rather than silently dropping that coverage.
    #
    # Image is the pgvector build, not plain `postgres`: the embedding migrations
    # create `vector` columns and a plain image would refuse them.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aks
          POSTGRES_PASSWORD: aks
          POSTGRES_DB: aks
        ports:
          - 5432:5432
        # Wait for readiness explicitly. Without a healthcheck the steps below can
        # start against a socket that is not accepting yet, which reads as a flaky
        # database rather than a race.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The schema steps further down do not read the variables below except `DATABASE_URL`:
      # `scripts/apply-schemas.sh` takes its target from the first non-flag argument or from
      # `DATABASE_URL` and exits 2 when both are empty, so `DATABASE_URL` is the one definition
      # only the schema runner reads.
      DATABASE_URL: postgresql://aks:aks@localhost:5432/aks
      # `AKS_DATABASE_URL` stays, and it is harmless because it does not survive: the setup file
      # below overwrites it in every worker with the URL this run resolved.
      AKS_DATABASE_URL: postgresql://aks:aks@localhost:5432/aks
      # `LLMWIKI_TEST_DATABASE_URL` is deliberately ABSENT here, and re-adding it is a regression.
      # With it set, `test/fixtures/testcontainers-postgres.ts` takes its override branch and logs
      # `[test-database] LLMWIKI_TEST_DATABASE_URL is set; no container started`, so CI creates no
      # container and every worker's per-run database lands on the one `localhost:5432/aks` server
      # this job's `services:` block owns for the whole run. Unset, `test/global-setup.ts` owns a
      # container for this run and publishes it, and `test/setup/test-database-url.ts` puts that
      # URL into both `*_DATABASE_URL` variables of every worker.
      #
      # Measured both ways at `0507318eb237b97fa92f84cfbebac9881ddc1d54`, from cold, empty
      # residual both arms: 6498 tests / 6486 passed / 12 skipped / 0 failed, exit 0, in
      # 6:28.95-7:02.83 with the variable set and 6:40.25 without it against a container this run
      # started. Honesty here costs no multi-fold slowdown, which is the only reason this line is
      # allowed to go.
      #
      # It is NOT sufficient on its own: removing it changes which SERVER the per-run databases
      # live on, not whether a suite owns one. A run with the variable unset still let one file's
      # row satisfy another file's assertion, which is what S2, S4 and S5 in
      # `odd/tasks/test-database-isolation.md` fix, and why this line lands with them.
      # `LLMWIKI_TEST_ALLOW_NO_DATABASE` must never appear in a workflow (`AGENTS.md`), and it is
      # not what makes this run own a fresh container: the line below is.
      #
      # That line is DECLARED, not left unset, and the reason is Quarkus Dev Services semantics:
      # unconfigured means a FRESH container, but here unset is fresh only by the accident of an
      # ephemeral runner having nothing to adopt. `test/fixtures/testcontainers-postgres.ts` calls
      # `.withReuse()` unconditionally, so a container an earlier run left behind stays adoptable,
      # and a pipeline must never reuse one. Reuse saves ~1.4 s against this job's 6–7 minute gate —
      # about 0.35% — which does not buy its residual risk. It stays available as an explicit local
      # opt-in, where a restart is measured in a second and the schema-parity drift guard protects
      # the reuse path. `turbo.json`'s `globalPassThroughEnv` is what carries it to `//#test`, and
      # `test/control-gates.test.ts` fails closed on a job env key that list does not account for.
      TESTCONTAINERS_REUSE_ENABLE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `AGENTS.md` requires this gate and no CI step ran it: its only other
      # home is `.husky/pre-commit`, which any `--no-verify` skips.
      - name: Type-check the root project
        run: pnpm exec tsc --noEmit
      # The house rules in `AGENTS.md` — 400-line files, 40-line functions, no
      # `any`, and the `src/` <-> `packages/llmwiki-kg` boundary — are enforced by
      # a ratchet: it passes on the frozen baseline and fails only on newly
      # introduced violations.
      - name: Lint the house rules against their frozen baseline
        run: pnpm run lint
      - run: pnpm run release:check-docs
      # The build front door is the task graph, not the root script. Deliberately
      # UNFILTERED, and that is the decision worth keeping: `turbo run build` resolves
      # `//#build` (tsup -> `dist/`) and `@repo/kg#build` (tsc ->
      # `packages/llmwiki-kg/ts/dist/`), two tasks in two distinct directories. It is
      # EXTENSIONAL — a package that later declares a `build` script joins this step by
      # existing. A `--filter=// --filter=@repo/kg` list would ENUMERATE the artefact
      # set instead, so the next emitter would silently stop being built here: an
      # item-6 defect introduced by the fix for an item-6 defect.
      - name: Build the distribution and the @repo/kg artefact through the task graph
        run: pnpm exec turbo run build
      # `turbo run build` above runs `@repo/kg#build`, which is `tsc -p
      # tsconfig.build.json` writing the same `packages/llmwiki-kg/ts/dist` the KG
      # REFERENCE RECIPE consumes (`packages/llmwiki-kg/Dockerfile:113` COPY, `:140` CMD).
      # That recipe is not a deliverable — see the note two blocks below. The explicit
      # `pnpm --filter @repo/kg run build` step that used to sit here was therefore a
      # duplicate of a task on the line above, and it was removed: a broken
      # `tsconfig.build.json` still fails a step named for building, because the task
      # that produces the artefact is that step. Do not re-add it — checking it against
      # the graph is what showed the duplication.
      # A NOTE, not a filter: `<NONEXISTENT>` ids are normal here. `build` is declared
      # for the whole workspace, so `@repo/api#build`, `@repo/foundation#build` and
      # `@repo/wiki#build` resolve with no command and are dropped from the run by
      # turbo. Those three members emit nothing by design; `turbo run build` executes
      # exactly two tasks, and says so: `Tasks: 2 successful, 2 total`.
      # This repository publishes exactly ONE image: the root `Dockerfile`. It is built
      # here and exercised by running it in both of its modes — `host` mode (the viewer's
      # origin gate, which accepts only the Host the container bound) and `serve` mode
      # (one stdio MCP session that must answer `initialize` AND advertise all 17 union
      # tool names). The second Dockerfile, `packages/llmwiki-kg/Dockerfile`, is a
      # REFERENCE RECIPE that ships nowhere: no workflow builds or pushes it for
      # delivery, no tag names it, and it is not a deliverable. It stays in this step's
      # matrix only so it cannot rot silently — a tree that keeps a buildable recipe has
      # to keep it buildable. NOTHING here is pushed anywhere: publishing an image is the
      # owner's decision, not CI's. Assembling is not the claim, so the script runs the
      # containers; a Dockerfile that builds into an image that dies on its first import
      # used to be invisible to every gate here.
      #
      # A STEP, not a new job: it shares `build-and-test`'s check identity --
      # with no authored job-level `name:`, GitHub renders the job id plus the
      # matrix value from `node-version: [24]`, so the check publishes as
      # `build-and-test (24)`, while a separate job would publish a different
      # name. `main` has no branch protection enabled (`"protected": false`,
      # no required-status-check contexts), so no red check blocks a merge and
      # these checks are advisory. If protection is ever turned on, the name to
      # require is `build-and-test (24)`, and an authored job-level `name:`
      # would replace that rendering outright.
      #
      # Cost, measured cold with `--no-cache` at
      # 5260d423963bd84911c239bfa5e57d2eec02bffe on a 16-core host: 64 s root +
      # 58 s KG = 122 s, under the +180 s line at which this would have to become a
      # separate job plus a branch-protection change (the owner's action, not a
      # decision taken here). Independently re-measured at HEAD, on the same host:
      # 73 s root + 74 s KG = 147 s cold -- still under that +180 s line, so the
      # decision holds on both observations, though with a 33 s margin rather than
      # 58 s and the margin is host-specific. The script prints its own per-image
      # seconds, so that figure stays honest as the Dockerfiles grow.
      #
      # The script sits in `.github/scripts/` because `.dockerignore` excludes
      # `.github` from every build context: the runtime image's `/app/scripts` stays
      # byte-identical, so this step cannot change the delivered artefact.
      - name: Build and smoke-test the published image and the KG reference recipe
        run: bash .github/scripts/docker-images-check.sh
      # The KG package carries its own tsconfig, and nothing else here reads it:
      # root `tsc` includes only `src/**`, and `codebase-health` ignores
      # `packages/llmwiki-kg/**`. Without this step its diagnostics are invisible
      # to every gate. `typecheck:kg` fails on any diagnostic that is not in
      # `kg-typecheck-baseline.json`, and on a baselined one that disappeared.
      - name: Type-check the KG package against its diagnostic ratchet
        run: pnpm run typecheck:kg
      - run: pnpm run fallow:kg
      # Build the schema from the same runner operators use, before any test needs
      # it. If a migration is missing from the runner, this is where it shows up --
      # `--check` asserts every tenant table exists AND enforces row-level security.
      - name: Apply database schemas
        run: ./scripts/apply-schemas.sh
      - name: Verify tenant isolation is enforced
        run: CHECK_ONLY=true ./scripts/apply-schemas.sh
      # The one test verdict in CI. `test:affected` is local-iteration tooling and
      # is deliberately absent: in this job it ran a SUBSET of the suite below and
      # was then superseded by it, so it never contributed a verdict the full run
      # would not have produced. It follows the schema steps because the suite
      # includes the database-backed suites.
      #
      # Selected through the graph, and the `--filter` is load-bearing. `//` is turbo's
      # identifier for the ROOT project — the root is NOT named `llm-wiki-compiler` to
      # turbo, and `--filter=llm-wiki-compiler` fails with `No package found with name
      # 'llm-wiki-compiler' in workspace`, exit 1. With `//#test` declared, this filter
      # resolves exactly ONE task, `//#test` = `vitest run` over all 827 collected
      # files. Dropping the filter would add `@repo/kg#test` to the run, a DERIVED
      # subset of those same 827 files (549 of them), so 549 file-runs would happen
      # twice; and a per-package-only model would miss the 99 files (70 `meta` + 29
      # `orphan`, `uncovered=0`) that belong to no package. The full suite is the gate.
      - name: Run the full suite through the task graph
        run: pnpm exec turbo run test --filter=//
      # Default tests exclude this fresh-install check. Exercise the shipped
      # facade, its exact workspace dependencies, and consumer declarations.
      - run: pnpm run test:pack

  # The gate, not the raw report. `pnpm run fallow:ci` is what `AGENTS.md` calls
  # "the command that actually gates": it runs `fallow audit --gate new-only` and
  # decides from the `attribution` block alone, so inherited findings are printed
  # and never counted. This job used to run the pinned `fallow-rs` action wrapper
  # with `fail-on-issues: true`, and that is a different command: on a push to
  # `main` it analysed the full tree and failed on inherited debt forever — run
  # 43140640639, "Fallow found 204 issues", measured back as 197 dead-code +
  # 6 dupes + 1 health in a tree with no `node_modules`, because this job never
  # installed and every workspace import resolved to nothing (169
  # `unresolved_imports`). The same command on an installed tree reports 46. So CI
  # and a laptop now run one command, and the only difference is the checkout
  # state it reads.
  #
  # pnpm and Node are provisioned exactly as `build-and-test` above and
  # `typecheck-tests.yml` do — `pnpm/action-setup@v4` (which resolves `packageManager`
  # from the root manifest) then `actions/setup-node@v4` with Node 24 and the pnpm
  # store cached. The package manager this job INSTALLS with is therefore the one it
  # GATES with, and nothing in a required check depends on what the runner image
  # happens to ship preinstalled. What the job needs is `node_modules`
  # (`scripts/fallow-ci.sh` runs `./node_modules/.bin/fallow`) plus full history —
  # `fetch-depth: 0` — because `audit` attributes against its own merge-base with a
  # LOCAL `main` ref, and a shallow checkout carries neither the history nor that ref.
  #
  # The base is the event's own: `github.event.before` on a `push` (the tip of
  # `main` before the push), `pull_request.base.sha` on a pull request. `BASE_SHA`
  # is empty or all zeros on a branch's first push, and then this step FAILS
  # instead of falling back to `origin/main`: a base that is not the event's own
  # would gate a changeset nobody asked about, and a vacuous pass is worse than a
  # red step. HEAD is detached before `main` is repointed, because moving the
  # checked-out branch moves HEAD with it and `audit` would compare HEAD against
  # itself.
  #
  # `FALLOW_CI_REQUIRE_DISTINCT_BASE=1` is what makes that refusal fatal, and this job
  # is the ONLY place that sets it. Without the variable the script warns on stderr and
  # runs anyway — the shape a developer on a fresh branch is in, where HEAD == `main`
  # until the first commit lands, `.husky/pre-commit` runs this same script, and
  # `AGENTS.md` forbids `--no-verify`. With it, CI can never be green having compared
  # nothing. Deleting the line below would not fail anything else: the local shape is
  # legitimate, so the warning would take over silently. `test/control-gates.test.ts`
  # pins the declaration for exactly that reason.
  #
  # A missing base is loud, never silently green: `fallow` exits 2 when it cannot
  # resolve the ref, and `scripts/check-fallow-report.mjs` fails closed with
  # exit 2 when the document cannot prove new-only attribution.
  codebase-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Install, establish the base, detach, repoint `main`, run the gate: one
      # step, so no rotation of steps can separate the base from the run that
      # depends on it.
      - name: Gate the codebase health of this changeset
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The strict mode of `scripts/fallow-ci.sh`, set HERE and nowhere else.
          FALLOW_CI_REQUIRE_DISTINCT_BASE: "1"
        run: |
          pnpm install --frozen-lockfile
          base="${BASE_SHA}"
          case "$base" in
            '' | 0000000000000000000000000000000000000000)
              echo "::error::codebase-health could not establish the base commit for this event; refusing to run a gate that compared nothing" >&2
              exit 1
              ;;
          esac
          git checkout --detach --quiet
          git update-ref refs/heads/main "$base"
          pnpm run fallow:ci
