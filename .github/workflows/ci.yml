name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  # Linux only — a deliberate, revisitable choice, recorded here because it is
  # what let issue #163 ship: on win32 `path.sep` ("\") made every nested profile
  # directory fail containment, so no profile could load, and nothing here saw it.
  #
  # A windows-latest leg was tried in #172 and taken back out. It confirmed the
  # separator fix holds on win32, then surfaced 64 unrelated failures across 44
  # files — chiefly that O_NOFOLLOW is POSIX-only, so every "fails closed on a
  # symlinked leaf" guard quietly degrades to a plain open there. Nor is
  # `continue-on-error` a way to land the leg non-blocking: the workflow run goes
  # green but the job's check-run still reports failure and blocks the merge.
  #
  # So win32 behaviour is held by the `sep` test seam in `src/utils/path-confine.ts`,
  # NOT by CI. Restoring this leg means fixing those 64 failures first — worth
  # doing as its own change, and not free.
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    # The wiki stores its corpus, graph, candidates and compile state in Postgres,
    # so a Stack-less project is on its way out. The database-backed suites no
    # longer skip when the harness is unreachable: they fail loudly instead. This
    # service exists so those suites can actually run here, and the job now fails
    # rather than silently dropping that coverage.
    #
    # Image is the pgvector build, not plain `postgres`: the embedding migrations
    # create `vector` columns and a plain image would refuse them.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aks
          POSTGRES_PASSWORD: aks
          POSTGRES_DB: aks
        ports:
          - 5432:5432
        # Wait for readiness explicitly. Without a healthcheck the steps below can
        # start against a socket that is not accepting yet, which reads as a flaky
        # database rather than a race.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suites read the two `*_DATABASE_URL` variables below. The schema steps further down do
      # not: `scripts/apply-schemas.sh` takes its target from the first non-flag argument or from
      # `DATABASE_URL` and exits 2 when both are empty, so `DATABASE_URL` is the one definition
      # only the schema runner reads.
      DATABASE_URL: postgresql://aks:aks@localhost:5432/aks
      LLMWIKI_TEST_DATABASE_URL: postgresql://aks:aks@localhost:5432/aks
      AKS_DATABASE_URL: postgresql://aks:aks@localhost:5432/aks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `AGENTS.md` requires this gate and no CI step ran it: its only other
      # home is `.husky/pre-commit`, which any `--no-verify` skips.
      - name: Type-check the root project
        run: pnpm exec tsc --noEmit
      # The house rules in `AGENTS.md` — 400-line files, 40-line functions, no
      # `any`, and the `src/` <-> `packages/llmwiki-kg` boundary — are enforced by
      # a ratchet: it passes on the frozen baseline and fails only on newly
      # introduced violations.
      - name: Lint the house rules against their frozen baseline
        run: pnpm run lint
      - run: pnpm run release:check-docs
      - run: pnpm run build
      # The artefact the runtime image ships was compiled only incidentally: the
      # kg-mcp-e2e harness runs `tsc -p packages/llmwiki-kg/ts/tsconfig.build.json`
      # inside root `pnpm test` (`test/kg-mcp-e2e/probe-harness.ts:46`), so breaking
      # packaging surfaced as a red MCP fixture naming the wrong subsystem. This step
      # makes the build explicit delivery work, failing in a step named for delivery.
      # A STEP, not a new job: it inherits the required `build-and-test (24)` name,
      # while a new job name has no branch-protection entry and could be merged past.
      - name: Build the @repo/kg artefact the image ships
        run: pnpm --filter @repo/kg run build
      # The KG package carries its own tsconfig, and nothing else here reads it:
      # root `tsc` includes only `src/**`, and `codebase-health` ignores
      # `packages/llmwiki-kg/**`. Without this step its diagnostics are invisible
      # to every gate. `typecheck:kg` fails on any diagnostic that is not in
      # `kg-typecheck-baseline.json`, and on a baselined one that disappeared.
      - name: Type-check the KG package against its diagnostic ratchet
        run: pnpm run typecheck:kg
      - run: pnpm run fallow:kg
      # Build the schema from the same runner operators use, before any test needs
      # it. If a migration is missing from the runner, this is where it shows up --
      # `--check` asserts every tenant table exists AND enforces row-level security.
      - name: Apply database schemas
        run: ./scripts/apply-schemas.sh
      - name: Verify tenant isolation is enforced
        run: CHECK_ONLY=true ./scripts/apply-schemas.sh
      # The one test verdict in CI. `test:affected` is local-iteration tooling and
      # is deliberately absent: in this job it ran a SUBSET of the suite below and
      # was then superseded by it, so it never contributed a verdict the full run
      # would not have produced. It follows the schema steps because the suite
      # includes the database-backed suites.
      - run: pnpm test
      # Default tests exclude this fresh-install check. Exercise the shipped
      # facade, its exact workspace dependencies, and consumer declarations.
      - run: pnpm run test:pack

  # Scope note, verified: this workflow never passes `--changed-since`. The
  # pinned `fallow-rs/fallow` wrapper (the `uses:` below) declares an
  # `auto-changed-since` input defaulting to `true`, and on
  # `pull_request`/`pull_request_target` events it injects
  # `--changed-since "$PR_BASE_SHA"`, so PR runs analyze the diff only. A push
  # to `main` has no PR context, so this same job runs full-tree there.
  # Base-SHA resolution can fail (shallow checkouts walk a fallback chain);
  # when it does the wrapper drops the flag and the run degrades to full-tree,
  # not to an error.
  # Verification depth: the absence of `--changed-since` is checked against
  # this file; the injection mechanism was read from the action wrapper's
  # source at the pinned commit, not from anything in this repository.
  # Re-verify upstream at the pin before changing the inputs below.
  codebase-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the action wrapper while using the signed 2.82.0 binary release.
      - uses: fallow-rs/fallow@5cc7152083ad57f20880a14ac82262a5a6861eec
        with:
          version: 2.82.0
          fail-on-issues: true
