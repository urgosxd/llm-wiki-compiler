# Workspace members. This is the pnpm-side statement of the root
# `package.json` `workspaces` field, which pnpm does not read (npm still needs
# that field for `npm publish --workspace`).
packages:
  - packages/api
  - packages/foundation
  - packages/llmwiki-kg/ts
  - packages/wiki

# Mirror of the root `package.json` `overrides` field, which pnpm ignores. This
# is NOT a new pin: npm already forces esbuild 0.28.1 for this tree, and the
# port must resolve the same version or it would be changing a dependency.
overrides:
  esbuild: 0.28.1

# The three settings below are the LIVE values. This pnpm (11.5.0) does not apply
# pnpm-specific settings from `.npmrc` — proven with `pnpm config get
# node-linker` returning `undefined` while a `.npmrc` was on disk — so this file
# is now their SOLE source: the root `.npmrc` is deleted on this branch (it held
# only keys pnpm never read), and its full original contents are preserved as
# record L3 in `odd/tasks/pnpm-phantom-deps.md`. Verified with
# `pnpm config get <key>` before importing.

# npm's layout is flat, and this delivery changes exactly one variable: the
# package manager. pnpm's default strict layout would surface phantom
# dependencies (imports that npm's flat `node_modules` satisfied implicitly) all
# at once. Hoisting keeps the installed tree compatible; probing what it hides is
# a follow-up, not this delivery.
nodeLinker: hoisted

# npm recorded its workspace links in `package-lock.json` as
# {"resolved":"packages/<member>","link":true}, so pnpm must resolve a member the
# same way. Without this it consults the registry first and fails with
# ERR_PNPM_NO_MATCHING_VERSION for a version that only exists in this tree.
linkWorkspacePackages: true

# Make the local workspace win over a registry version whenever both could
# satisfy a range, so the collapsed single lockfile resolves the workspace
# package the way npm's legacy dedupe did instead of installing a second copy.
preferWorkspacePackages: true

# pnpm refuses to run dependency install scripts unless they are ALLOWED, and
# fails the install otherwise (`ERR_PNPM_IGNORED_BUILDS`). npm ran them all by
# default, so allowing them restores npm's install behaviour — not a new
# capability. `esbuild` needs its script to place the platform binary tsup and
# vitest execute; the other three are native/optional bindings that npm also
# built.
#
# `allowBuilds` below is the key that actually binds this pnpm: 11.5.0 does NOT
# read `onlyBuiltDependencies` in any form (bare names and `name@version` both
# still raised `ERR_PNPM_IGNORED_BUILDS`), and the boolean `true` per name under
# `allowBuilds` is what makes `pnpm install --frozen-lockfile` exit 0.
# `onlyBuiltDependencies` is kept because older pnpm honours it; on this version
# it is inert, not a second gate.
onlyBuiltDependencies:
  - cpu-features
  - esbuild
  - protobufjs
  - ssh2

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
