name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector so `vector(768)` and the HNSW index exist: the schema will
        # not apply on a stock postgres image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aks
          POSTGRES_PASSWORD: aks
          POSTGRES_DB: aks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite connects here. Integration tests skip cleanly when the
      # database is unreachable, so a broken service shows up as skips rather
      # than failures — the "guard against silent skips" step below turns that
      # into a hard error.
      AKS_TEST_DATABASE_URL: postgresql://aks:aks@localhost:5432/aks

    defaults:
      run:
        working-directory: ts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: psql "$AKS_TEST_DATABASE_URL" -f ../db/schema.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test 2>&1 | tee test-output.log

      - name: Guard against silent skips
        # Integration suites skip when the DB is unreachable, so a broken
        # service would turn the database layer green by doing nothing.
        #
        # Four skips are expected: the live-LLM tests gated behind
        # AKS_TEST_GATEWAY, which cannot run here because CI has no provider
        # credentials. More than four means the database is unreachable and
        # the integration suites silently opted out.
        run: |
          line=$(grep -oE 'Tests +[0-9]+ passed( \| [0-9]+ skipped)?' test-output.log | tail -1)
          echo "summary: $line"
          skipped=$(echo "$line" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+' || echo 0)
          if [ "$skipped" -gt 4 ]; then
            echo "::error::Expected at most 4 skips (live-LLM tests), got $skipped."
            echo "The database service is probably unreachable, which makes the"
            echo "integration suites skip instead of fail."
            grep -E 'skipping integration' test-output.log || true
            exit 1
          fi

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: ts/test-output.log
          if-no-files-found: ignore
