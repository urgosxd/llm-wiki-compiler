services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aks
      POSTGRES_PASSWORD: aks
      POSTGRES_DB: aks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aks"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # NOT A DELIVERABLE. This service builds the REFERENCE RECIPE
    # (`packages/llmwiki-kg/Dockerfile`): it ships nowhere, no workflow pushes it and no
    # tag names it. The one published image is the root `Dockerfile`, and it serves both
    # MCP tool sets by itself -- `docker run <image>` for stdio, `LLMWIKI_MODE=host` for
    # HTTP on 4173. Kept here so the reference build keeps a usable local composition.
    #
    # The KG image installs from the repository-root `pnpm-lock.yaml` and
    # `pnpm-workspace.yaml`, so its build context must be the repo root; no COPY
    # can reach above the context. Paths are relative to this compose file.
    build:
      context: ../..
      dockerfile: packages/llmwiki-kg/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aks:aks@db:5432/aks
      AKS_API_KEY: ${AKS_API_KEY:-}

      # Provider selection
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-anthropic}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-claude-sonnet-4-5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}

      # Provider credentials
      #
      # The two `GATEWAY_EMBEDDINGS_*` entries are bare pass-throughs: they carry
      # the operator's value verbatim and go empty when it is unset. No fallback is
      # substituted here on purpose -- compose resolves before the container starts,
      # so a value substituted here would reach the process as if the operator had
      # configured it, and the embeddings inheritance rule would be implemented in
      # two layers that can disagree. The application inherits from `GATEWAY_URL`
      # and `GATEWAY_API_KEY` at resolution time when these are blank, and reports
      # at startup which variable supplied the embeddings endpoint and credential.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_URL: ${GATEWAY_URL:-}
      GATEWAY_EMBEDDINGS_BASE_URL: ${GATEWAY_EMBEDDINGS_BASE_URL:-}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      GATEWAY_EMBEDDINGS_API_KEY: ${GATEWAY_EMBEDDINGS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/code/uploads

volumes:
  postgres_data: