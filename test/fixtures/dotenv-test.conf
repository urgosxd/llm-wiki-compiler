# Test-only environment corpus, read by CLI subprocesses INSTEAD of the operator's
# `.env`, through `DOTENV_CONFIG_PATH`.
#
# WHY THIS EXISTS. `src/cli/environment.ts` calls `require("dotenv/config")`, which
# resolves `./.env` from the subprocess cwd. Every test that spawns the CLI therefore
# inherited whatever the developer had in their real `.env` -- real keys, real Stack
# id, real provider. Two suites failed only on machines with a populated `.env` and
# passed on CI, which is the worst failure shape available: green where nobody looks,
# red where you work.
#
# Two hazards closed here, both measured on this repository:
#   - `AKS_STACK_ID` set  ->  `withCandidateSource` returns a row source, so
#     `listCandidates` reads Postgres instead of the suite's temp root. The assertion
#     then compares 0 against 1 for a reason the test literally cannot see.
#   - `OPENAI_*` / `OPENROUTER_*` set  ->  a suite designed to be keyless can reach
#     the network, and a real provider's latency becomes the test's timeout.
#
# KEEP THIS FILE SMALL AND DETERMINISTIC. It is a corpus, not a mirror of `.env`:
# every value must produce the same bytes on every machine, and no value may be a
# credential. Never add a real key here.
#
# `.gitignore` excludes `.env.*` wholesale, which is why this is NOT named `.env.test`:
# a committed corpus has to be visible to git.

# The documented local test container (`llmwiki-kg-db-1`, published on 5434). The same
# value `test/fixtures/test-database.ts` resolves, so a subprocess and its parent can
# never land on different databases.
AKS_DATABASE_URL=postgresql://aks:aks@localhost:5434/aks

# Deliberately ABSENT: AKS_STACK_ID. Its presence is exactly what redirects candidate
# reads and pending-embedding drains into Postgres, so leaving it unset is what keeps
# those suites on the file backend and their assertions meaningful.

# Credential-free deterministic stand-in: no network, no key, identical output for
# identical input on every run.
LLMWIKI_PROVIDER=offline
LLMWIKI_MODEL=offline-deterministic

# Small and fixed. The default concurrency fans out one provider call per chunk, and a
# corpus of a handful of pages gains nothing from five parallel calls while the
# scheduling noise costs reproducibility.
LLMWIKI_COMPILE_CONCURRENCY=2
LLMWIKI_EMBED_BATCH_SIZE=8
